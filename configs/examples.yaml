# VLA-RL 配置文件
# 使用方式: python scripts/train_offline.py --config configs/examples.yaml --config_name bc_mlp

configs:
  # ==================== BC 配置 ====================
  bc_mlp:
    exp_name: "bc_mlp_demo"
    seed: 42
    device: "cuda"
    
    env:
      name: "dummy"
      state_dim: 16
      action_dim: 7
      max_episode_steps: 200
    
    model:
      policy_type: "mlp"
      hidden_dims: [256, 256]
      activation: "relu"
    
    algorithm:
      name: "bc"
      lr: 1e-4
      batch_size: 64
      grad_clip: 1.0
    
    data:
      demo_paths: ["data/demos/*.hdf5"]
      load_images: false
    
    training:
      total_steps: 10000
      batch_size: 64
      log_freq: 100
      checkpoint_freq: 1000
      checkpoint_dir: "./checkpoints"

  # ==================== TD3+BC 配置 ====================
  td3bc:
    exp_name: "td3bc_demo"
    seed: 42
    device: "cuda"
    
    env:
      name: "dummy"
      state_dim: 16
      action_dim: 7
      max_episode_steps: 200
    
    model:
      policy_type: "mlp"
      hidden_dims: [256, 256]
      activation: "relu"
    
    algorithm:
      name: "td3bc"
      lr: 3e-4
      batch_size: 256
      gamma: 0.99
      tau: 0.005
      bc_alpha: 2.5
      policy_noise: 0.2
      noise_clip: 0.5
      policy_freq: 2
    
    data:
      demo_paths: ["data/demos/*.hdf5"]
      load_images: false
    
    training:
      total_steps: 100000
      batch_size: 256
      log_freq: 100
      checkpoint_freq: 5000

  # ==================== SAC Online 配置 ====================
  sac_online:
    exp_name: "sac_online"
    seed: 42
    device: "cuda"
    
    env:
      name: "dummy"
      state_dim: 16
      action_dim: 4
      max_episode_steps: 200
    
    model:
      policy_type: "mlp_gaussian"
      hidden_dims: [256, 256]
      activation: "relu"
    
    algorithm:
      name: "sac"
      lr: 3e-4
      batch_size: 256
      gamma: 0.99
      tau: 0.005
      alpha: 0.2
      auto_alpha: true
    
    training:
      total_steps: 100000
      batch_size: 256
      log_freq: 100
      checkpoint_freq: 10000
    
    inference:
      deterministic: false
    
    weight_sync:
      method: "shared_memory"
      sync_freq: 100

  # ==================== 双目机器人 BC 配置 ====================
  binocular_bc:
    exp_name: "binocular_bc"
    seed: 42
    device: "cuda"
    
    env:
      name: "binocular"
      state_dim: 15
      action_dim: 15
      max_episode_steps: 500
    
    model:
      policy_type: "mlp"
      hidden_dims: [512, 512, 256]
      activation: "relu"
    
    algorithm:
      name: "bc"
      lr: 1e-4
      batch_size: 64
      grad_clip: 1.0
    
    data:
      demo_paths: ["data/binocular/*.hdf5"]
      camera_keys:
        - "base_0_rgb_0"
        - "base_0_rgb_1"
        - "right_wrist_0_rgb_0"
        - "right_wrist_0_rgb_1"
      load_images: true
    
    training:
      total_steps: 50000
      batch_size: 64
      log_freq: 100
      checkpoint_freq: 5000
