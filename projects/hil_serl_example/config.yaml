# HIL-SERL 示例配置

env:
  type: h1_robot
  state_dim: 28
  action_dim: 14
  fps: 10

buffers:
  demo:
    type: offline
    data_path: ./data/demos.hdf5
  rollout:
    type: replay
    capacity: 100000
  intervention:
    type: intervention
    capacity: 50000

sampler:
  type: hilserl
  weights:
    demo: 1.0
    rollout: 1.0
    intervention: 2.0

policy:
  type: hilserl
  state_dim: 28
  action_dim: 14
  hidden_dims: [256, 256]
  init_temperature: 0.01
  reward_classifier:
    num_cameras: 2
    num_classes: 2
    input_shape: [3, 128, 128]
    pretrained_path: null  # 设置为训练好的分类器路径
  device: cuda

algorithm:
  type: hilserl
  gamma: 0.99
  tau: 0.005
  actor_lr: 3e-4
  critic_lr: 3e-4
  alpha_lr: 3e-4
  utd_ratio: 1
  intervention_bonus: 0.0
  device: cuda

training:
  total_steps: 100000
  batch_size: 256
  log_freq: 100
  eval_freq: 5000
  checkpoint_freq: 10000
  log_dir: ./logs/hilserl_example
  checkpoint_dir: ./checkpoints/hilserl_example
