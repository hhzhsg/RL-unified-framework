# H1 实机 HIL 训练配置
# 用于今晚验证 Actor-Learner 通信流程

# === 环境配置 ===
env:
  type: h1_robot
  control_mode: position

# === 策略配置 ===
policy:
  type: mlp
  # state: arm_pos(14) + arm_vel(14) + gripper(2) + waist(3) + head(2) + base(2) = 37
  state_dim: 37
  # action: arm_pos(14) + gripper(2) + waist(3) + head(2) + base(2) = 23
  action_dim: 23
  hidden_dims: [256, 256]
  activation: relu
  device: cpu          # Actor 端用 CPU

# === 算法配置 ===
algorithm:
  type: bc
  learning_rate: 0.0003
  device: cuda         # Learner 端用 GPU

# === Demo 数据 ===
buffers:
  demo:
    type: demo
    data_path: data/demo/hdf5test

# === HIL 配置 ===
hil:
  enabled: true
  mode: grpc           # 分布式模式（Actor/Learner 分开运行）
  
  # VR 干预 Wrapper
  wrapper:
    enabled: true
    type: vr
    vr_device: quest
    action_scale: 1.0
    trigger_button: grip
  
  # Actor 端配置
  actor:
    deterministic: false
    max_episode_steps: 200
    weight_sync_freq: 1
    transition_batch_size: 1
    require_initial_weights: true
  
  # Learner 端配置
  learner:
    batch_size: 256
    utd_ratio: 1
    training_starts: 100       # 调低方便调试
    policy_push_frequency: 100
    checkpoint_freq: 1000
    checkpoint_dir: ./checkpoints/h1_hil
    # 采样权重
    demo_weight: 1.0
    rollout_weight: 1.0
    intervention_weight: 2.0
    # Buffer 容量
    rollout_buffer_capacity: 100000
    intervention_buffer_capacity: 50000

# === 通信配置 ===
sync:
  host: localhost      # Learner 地址（改成 GPU 服务器 IP）
  port: 50060
  heartbeat_interval: 5.0
  timeout: 30.0

# === 日志配置 ===
log_dir: ./logs/h1_hil
log_freq: 100
