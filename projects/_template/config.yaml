# 实验配置模板

# 环境配置
env:
  type: dummy
  state_dim: 16
  action_dim: 4
  max_episode_steps: 200

# Buffer配置
buffers:
  rollout:
    type: replay
    capacity: 100000

# 采样器配置
sampler:
  type: uniform

# 策略配置
policy:
  type: sac
  state_dim: 16
  action_dim: 4
  hidden_dims: [256, 256]
  init_temperature: 0.1
  device: cuda

# 算法配置
algorithm:
  type: sac
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  device: cuda

# HIL 配置（可选，设置 enabled: true 启用）
hil:
  enabled: false  # 设为 true 启用 HIL 模式
  mode: local     # local / grpc

# 训练配置
training:
  total_steps: 100000
  batch_size: 256
  log_freq: 100
  eval_freq: 5000
  checkpoint_freq: 10000
  log_dir: ./logs
  checkpoint_dir: ./checkpoints
