# VLA-RL 训练配置
# 使用方式: python scripts/train.py --config config/train_config.yaml

configs:
  # ============ 离线 BC 训练 ============
  offline_bc:
    exp_name: "offline_bc_test"
    seed: 42
    device: "cuda"
    
    # 环境/数据维度配置
    env:
      name: "zerith_robot"
      state_dim: 65       # 14+14+14+2+2+14+2+3
      action_dim: 37      # 14+2+2+14+2+3
      action_space: "joint"
    
    # 数据配置
    data:
      type: "hdf5"
      demo_paths:
        - '/home/charles/rl_code/depth-anything-3/hdf5test/0ad247b50b1647e8af8be6847b2b5bc5/0ad247b50b1647e8af8be6847b2b5bc5_sub0.hdf5'
      camera_keys:
        - "cam_high"
        - "cam_left_wrist"
        - "cam_right_wrist"
      load_images: false   # 先不加载图像，验证流程
    
    # 模型配置
    model:
      policy_type: "mlp"
      hidden_dims: [256, 256, 128]
      use_robot_state: true
    
    # 算法配置
    algorithm:
      name: "bc"
      lr: 3.0e-4
      batch_size: 64
    
    # 训练配置
    training:
      stages:
        - name: "bc_offline"
          algorithm: "bc"
          max_steps: 1000
          active_models: ["policy"]
          sample_strategy: "demo_only"
      log_freq: 50
      eval_freq: 1000
      save_freq: 1000
      checkpoint_dir: "./checkpoints/offline_bc"
  
  # ============ 离线 TD3+BC 训练 ============
  offline_td3bc:
    exp_name: "offline_td3bc_test"
    seed: 42
    device: "cuda"
    
    env:
      name: "zerith_robot"
      state_dim: 65
      action_dim: 37
      action_space: "joint"
    
    data:
      type: "hdf5"
      demo_paths:
        - '/home/charles/rl_code/depth-anything-3/hdf5test/0ad247b50b1647e8af8be6847b2b5bc5/0ad247b50b1647e8af8be6847b2b5bc5_sub0.hdf5'
      camera_keys:
        - "cam_high"
      load_images: false
    
    model:
      policy_type: "mlp"
      hidden_dims: [256, 256, 128]
    
    algorithm:
      name: "td3_bc"
      lr: 3.0e-4
      batch_size: 64
      gamma: 0.99        # 折扣因子
      tau: 0.005         # 软更新系数
      bc_alpha: 2.5      # BC 正则强度
      policy_noise: 0.2  # 目标动作噪声
      noise_clip: 0.5    # 噪声裁剪
      policy_freq: 2     # 每2步更新一次 policy
    
    training:
      stages:
        - name: "td3bc_offline"
          algorithm: "td3_bc"
          max_steps: 2000
          active_models: ["policy", "q1", "q2"]
          sample_strategy: "demo_only"
      log_freq: 50
      save_freq: 2000
      checkpoint_dir: "./checkpoints/offline_td3bc"
  
  # ============ 在线 SAC 训练 (预留) ============
  online_sac:
    exp_name: "online_sac"
    seed: 42
    device: "cuda"
    
    env:
      name: "zerith_robot"
      state_dim: 65
      action_dim: 37
      action_space: "joint"
    
    data:
      type: "buffer"
      rollout_capacity: 100000
    
    model:
      policy_type: "mlp_gaussian"
      hidden_dims: [256, 256]
    
    algorithm:
      name: "sac"
      lr: 3.0e-4
      batch_size: 256
      gamma: 0.99
      tau: 0.005
      alpha: 0.2
      auto_alpha: true
    
    training:
      stages:
        - name: "sac_online"
          algorithm: "sac"
          max_steps: 500000
          active_models: ["policy", "critic"]
          sample_strategy: "rollout_only"
      log_freq: 100
      save_freq: 10000
      checkpoint_dir: "./checkpoints/online_sac"
    
    weight_sync:
      method: "queue"
      sync_freq: 100

  # ============ 在线 SAC + DummyEnv (数据流验证) ============
  online_sac_dummy:
    exp_name: "online_sac_dummy"
    seed: 42
    device: "cpu"  # 使用 CPU 进行验证
    
    env:
      name: "dummy"
      state_dim: 16           # 简化维度便于验证
      action_dim: 4
      action_space: "joint"
      max_episode_steps: 200
      obs_cameras: ["front"]
      image_size: 64
    
    data:
      type: "buffer"
      rollout_capacity: 50000
    
    model:
      policy_type: "mlp_gaussian"
      hidden_dims: [128, 128]
    
    algorithm:
      name: "sac"
      lr: 3.0e-4
      batch_size: 128
      gamma: 0.99
      tau: 0.005
      alpha: 0.2
      auto_alpha: true
    
    training:
      stages:
        - name: "sac_online"
          algorithm: "sac"
          max_steps: 10000      # 少量步数用于验证
          active_models: ["policy", "q1", "q2"]
          sample_strategy: "rollout_only"
      log_freq: 100
      save_freq: 2000
      checkpoint_dir: "./checkpoints/online_sac_dummy"
    
    weight_sync:
      method: "queue"
      sync_freq: 50
